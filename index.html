<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LYNCK Digital | Premium Digital Products & Templates for Creators</title>
    <meta name="description" content="LYNCK Digital offers premium digital products, templates, courses, and resources for creators and entrepreneurs. Shop lynckdigital for high-quality business tools, marketing kits, and eBooks." />
    <meta name="author" content="LYNCK Digital" />
    <meta name="keywords" content="lynck, lynckdigital, lynck digital, digital products, templates, courses, eBooks, business tools, marketing resources, creator tools, entrepreneur resources" />
    
    <!-- Canonical URL -->
    <link rel="canonical" href="https://lynckdigital.store" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lynckdigital.store" />
    <meta property="og:title" content="LYNCK Digital | Premium Digital Products & Templates" />
    <meta property="og:description" content="Shop premium digital products at LYNCK Digital. Templates, courses, eBooks, and tools for creators and entrepreneurs. Your gateway to success." />
    <meta property="og:image" content="https://lynckdigital.store/assets/logo.png" />
    <meta property="og:site_name" content="LYNCK Digital" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://lynckdigital.store" />
    <meta name="twitter:title" content="LYNCK Digital | Premium Digital Products & Templates" />
    <meta name="twitter:description" content="Shop premium digital products at LYNCK Digital. Templates, courses, eBooks, and tools for creators and entrepreneurs." />
    <meta name="twitter:image" content="https://lynckdigital.store/assets/logo.png" />
    
    <!-- Additional SEO -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    
    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LYNCK Digital",
      "alternateName": ["lynckdigital", "lynck digital", "lynck"],
      "url": "https://lynckdigital.store",
      "logo": "https://lynckdigital.store/assets/logo.png",
      "description": "Premium digital products and resources for creators, developers, and entrepreneurs.",
      "sameAs": []
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LYNCK Digital",
      "alternateName": "lynckdigital",
      "url": "https://lynckdigital.store",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://lynckdigital.store/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
